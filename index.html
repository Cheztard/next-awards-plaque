<style>
/* Layout: full-bleed 3D stage, award caption top-left, view controls docked bottom-center */
:root {
  --stage: #ffffff;
  --stage-2: #ffffff;
  color-scheme: light;
  --ink: #0f1838;
  --muted: #5a6382;
  --line: rgba(15, 24, 56, 0.14);
  --chip: rgba(255, 255, 255, 0.72);
  --accent: #0a3fd6;
  --gold: #f2b211;
  --font-display: "Jost", "Futura", "Century Gothic", "Avenir Next", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
}
#stage {
  position: fixed; inset: 0;
  background: var(--stage);
  touch-action: none;
}
#stage canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.caption {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 24px; right: 24px;
  display: grid; gap: 6px;
  pointer-events: none;
  max-width: 34ch;
}
.eyebrow {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow i { width: 10px; height: 10px; display: inline-block; background: linear-gradient(135deg, var(--gold) 50%, var(--accent) 50%); }
.caption h1 {
  margin: 0; font-weight: 500; font-size: clamp(1.35rem, 3.2vw, 2rem); line-height: 1.12;
  letter-spacing: 0.01em; text-wrap: balance; text-transform: uppercase;
}
.caption p { margin: 0; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-size: 0.95rem; }

.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px; white-space: nowrap;
  padding: 6px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--chip); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  max-width: calc(100vw - 32px);
}
.dock button {
  font: 500 0.85rem/1 var(--font-display); letter-spacing: 0.04em;
  color: var(--ink); background: transparent; border: 0; border-radius: 999px;
  padding: 10px 14px; cursor: pointer;
}
.dock button:hover { background: var(--line); }
.dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dock #v-spin { margin-left: 6px; box-shadow: inset 0 0 0 1px var(--line); }
.dock button[aria-pressed="true"] { background: var(--ink); color: var(--stage); }

.hint {
  position: fixed; right: 24px; top: calc(env(safe-area-inset-top, 0px) + 28px);
  font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em;
  pointer-events: none; text-align: right;
}
.angle { font-variant-numeric: tabular-nums; color: var(--ink); }
@media (max-width: 640px) {
  .hint { top: auto; right: 16px; left: 16px; text-align: center; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
  .caption { left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .dock button { padding: 9px 12px; }
}
</style>

// Plaque front face as measured on the source photo (px). 1 unit = 1000 px.
const FACE = { x0: 222, y0: 72, x1: 1000, y1: 1212 };
const FW = FACE.x1 - FACE.x0, FH = FACE.y1 - FACE.y0;
// Sandwich build, from the reference photos: colored plate | clear glass core | colored plate, about 1 : 2 : 1.
const GLASS_T = 0.078, PLATE_T = 0.039, DEPTH = GLASS_T + 2 * PLATE_T;
const toV = (px, py) => new THREE.Vector2((px - FACE.x0 - FW / 2) / 1000, (FACE.y1 - py) / 1000);

// Colored acrylic panels: the yellow wedge and blue base share one diagonal through the apex.
const REGIONS = {
  clear:  [[222, 72], [355, 72], [703, 484], [222, 1013]],
  yellow: [[355, 72], [1000, 72], [1000, 836]],

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.transmissionResolutionScale = 1;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// Photo-studio environment: a mid-grey room with hard softboxes, so chamfers flash as the plaque turns.
function studioEnv() {
  const env = new THREE.Scene();
  const room = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
  room.color.setRGB(0.32, 0.34, 0.38);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), room));
  const box = (w, h, x, y, z, ry, rx, k) => {
    const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
    m.color.setRGB(k, k, k);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    p.position.set(x, y, z); p.rotation.set(rx, ry, 0);
    env.add(p);
  };
  box(7, 3, 0, 5.8, 0, 0, Math.PI / 2, 5);          // overhead
  box(0.8, 8, -5.8, 1, 1.5, Math.PI / 2, 0, 12);    // left strip
  box(0.8, 8, 5.8, 1, -1.5, -Math.PI / 2, 0, 12);   // right strip
  box(3, 5, -2.5, 1, 5.8, Math.PI, 0, 4);           // front-left key
  box(4, 4, 2, 1.5, -5.8, 0, 0, 3);                 // back fill
  box(12, 2, 0, -5.8, 0, 0, -Math.PI / 2, 0.9);     // floor bounce
  return pmrem.fromScene(env, 0.02).texture;
}
scene.environment = studioEnv();

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 50);

// Theme-aware stage color (the transmission pass needs a real background to refract).
function readStage() {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim();
  scene.background = new THREE.Color(c || '#e9ecf3');
  const dark = scene.background.getHSL({}).l < 0.4;
  shadowMat.opacity = dark ? 0.6 : 0.22;
}

// ---------- plaque ----------
const plaque = new THREE.Group();
scene.add(plaque);

// Chamfered glass shell per panel. bevelOffset pulls the chamfer inside the outline so panels meet edge to edge.
const CHAMFER = 0.0015; // plates are square-cut; only a hairline polished arris catches the light
function slab(pts, depth, ch) {
  const shape = new THREE.Shape(pts);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - 2 * ch, bevelEnabled: true, bevelThickness: ch,
    bevelSize: ch, bevelOffset: -ch, bevelSegments: 1, curveSegments: 1,
  });
  geo.translate(0, 0, -(depth - 2 * ch) / 2);
  return geo;
}
// Inset a convex counter-clockwise polygon by d (offset each edge inward, intersect neighbours).
function inset(pts, d) {
  const n = pts.length, lines = [];
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dir = b.clone().sub(a).normalize();
    const nrm = new THREE.Vector2(-dir.y, dir.x);
    lines.push([a.clone().addScaledVector(nrm, d), dir]);
  }
  return lines.map((L, i) => {
    const [p1, d1] = lines[(i + n - 1) % n], [p2, d2] = L;
    const den = d1.x * d2.y - d1.y * d2.x;
    const t = ((p2.x - p1.x) * d2.y - (p2.y - p1.y) * d2.x) / den;
    return p1.clone().addScaledVector(d1, t);
  });
}
// Re-sort an extrusion's side triangles: cut walls facing the clear notch glow (group 1); outer sides and the
// yellow/blue seam stay plain clear acrylic (group 2).
const NOTCH = [[[355, 72], [703, 484]], [[703, 484], [222, 1013]]].map((s) => s.map(([x, y]) => toV(x, y)));
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const u = Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - a.x - u * dx, py - a.y - u * dy);
}
function splitWalls(geo) {
  const src = geo.attributes, n = src.position.count;
  const side = geo.groups.find((g) => g.materialIndex === 1);
  const buckets = [[], [], []];
  const p = src.position.array;
  for (let i = 0; i < n; i += 3) {
    let b = 0;
    if (i >= side.start && i < side.start + side.count) {
      const cx = (p[i * 3] + p[i * 3 + 3] + p[i * 3 + 6]) / 3, cy = (p[i * 3 + 1] + p[i * 3 + 4] + p[i * 3 + 7]) / 3;
      b = NOTCH.some(([a, c]) => segDist(cx, cy, a, c) < 0.004) ? 1 : 2;
    }
    buckets[b].push(i);
  }
  const out = new THREE.BufferGeometry();
  for (const name of Object.keys(src)) {
    const a = src[name], size = a.itemSize, arr = new Float32Array(n * size);
    let k = 0;
    for (const bucket of buckets) for (const i of bucket) for (let v = 0; v < 3; v++)
      for (let c = 0; c < size; c++) arr[k++] = a.array[(i + v) * size + c];
    out.setAttribute(name, new THREE.BufferAttribute(arr, size));
  }
  let start = 0;
  buckets.forEach((bucket, mi) => { out.addGroup(start, bucket.length * 3, mi); start += bucket.length * 3; });
  return out;
}
const ccw = (pts) => (THREE.ShapeUtils.isClockWise(pts) ? pts.slice().reverse() : pts);

const glass = (o) => new THREE.MeshPhysicalMaterial({
  roughness: 0.015, metalness: 0, ior: 1.5, transmission: 1, thickness: PLATE_T,
  specularIntensity: 1, envMapIntensity: 1, ...o,
});
// Plates are clear acrylic; the color is a thin film on their inner face, bonded against the glass.
const plateMat = glass({ color: 0xffffff, roughness: 0.05, envMapIntensity: 0.3, attenuationColor: new THREE.Color(0xf2f7f7), attenuationDistance: 2 });
// Film colors are set so the front view matches the reference photo (yellow #e4a21b, blue #002eaa).
const film = (r, g, b) => {
  const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false });
  m.color.setRGB(r, g, b);
  return m;
};
// Cut walls glow with the film color seen through the acrylic edge, which is what makes the step read.
const wallMats = {
  yellow: glass({ color: 0xfff1d0, envMapIntensity: 0.6, attenuationColor: new THREE.Color(0xf0a01e), attenuationDistance: 0.05 }),
  blue:   glass({ color: 0xdfe6ff, envMapIntensity: 0.6, attenuationColor: new THREE.Color(0x1638b0), attenuationDistance: 0.05 }),
};
const filmMats = { yellow: film(0.885, 0.398, 0), blue: film(0, 0.018, 0.412) };

// Clear glass core, full outline. Faces stay clear; the polished sides carry a faint blue-green tint.
const glassFace = glass({ color: 0xffffff, thickness: GLASS_T, envMapIntensity: 0.5,
  attenuationColor: new THREE.Color(0xe6f5ef), attenuationDistance: 1.2 });
const glassSide = glass({ color: 0xf1f7f6, thickness: GLASS_T, envMapIntensity: 0.7,
  attenuationColor: new THREE.Color(0xc4dcd8), attenuationDistance: 0.35 });
const outline = ccw([[222, 72], [1000, 72], [1000, 1212], [222, 1212]].map(([x, y]) => toV(x, y)));
plaque.add(new THREE.Mesh(slab(outline, GLASS_T, 0.003), [glassFace, glassSide]));

// Yellow and blue plates bonded to the front and back. The clear panel has none, so the glass sits one plate deep.
for (const side of [1, -1]) {
  for (const k of ['yellow', 'blue']) {
    const pts = ccw(REGIONS[k].map(([x, y]) => toV(x, y)));
    const plate = new THREE.Mesh(splitWalls(slab(pts, PLATE_T, CHAMFER)), [plateMat, wallMats[k], plateMat]);
    plate.position.z = side * (GLASS_T / 2 + PLATE_T / 2);
    const layer = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), filmMats[k]);
    layer.position.z = side * (GLASS_T / 2 + 0.0009);
    plaque.add(plate, layer);
  }
}

// Soft contact shadow
const sh = document.createElement('canvas');
sh.width = sh.height = 256;
{
  const g = sh.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,1)'); grd.addColorStop(0.45, 'rgba(0,0,0,0.45)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
}
const shadowMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false, opacity: 0.32, toneMapped: false });
shadowMat.color.set(0x000000);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.3), shadowMat);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.001;
plaque.add(shadow);
readStage();

// ---------- print layer, cut from the sharp reference photo ----------
// The reference has a transparent background, so its own alpha is the logo's matte.
// Each element is mapped from the model's layout (FACE px) into the reference by a scale + offset.
const PRINT = [
  // model box [x0, y0, x1, y1] -> reference origin + scale
  { name: 'logo', box: [275, 393, 612, 765], map: (x, y) => [250 + (x - 285) * (322 / 317), 422 + (y - 403) * (357 / 352)] },
  { name: 'mark', box: [825, 121, 948, 245], map: (x, y) => [840 + (x - 835) * (106 / 103), 157 + (y - 131)] },
  { name: 'text', box: [412, 965, 852, 1120], map: (x, y) => [412 + (x - 427), 1084.5 + (y - 1041.5)] },
];
const img = new Image();
img.onload = () => {
  const src = document.createElement('canvas');
  src.width = img.width; src.height = img.height;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);
  const S = sctx.getImageData(0, 0, img.width, img.height).data;
  const IW = img.width, IH = img.height;
  const sample = (u, v) => { // bilinear RGBA
    const x0 = Math.floor(u), y0 = Math.floor(v), fx = u - x0, fy = v - y0, o = [0, 0, 0, 0];
    for (const [dx, dy, wgt] of [[0, 0, (1 - fx) * (1 - fy)], [1, 0, fx * (1 - fy)], [0, 1, (1 - fx) * fy], [1, 1, fx * fy]]) {
      const xx = Math.min(IW - 1, Math.max(0, x0 + dx)), yy = Math.min(IH - 1, Math.max(0, y0 + dy));
      const i = (yy * IW + xx) * 4;
      const a = S[i + 3] / 255;
      o[0] += S[i] * a * wgt; o[1] += S[i + 1] * a * wgt; o[2] += S[i + 2] * a * wgt; o[3] += a * wgt;
    }
    return o[3] > 0 ? [o[0] / o[3], o[1] / o[3], o[2] / o[3], o[3]] : [0, 0, 0, 0];
  };
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const SC = 3; // texture px per model px
  // Logo is printed on the recessed glass face; the mark and award text sit on the front plate.
  const outs = { glass: new ImageData(FW * SC, FH * SC), plate: new ImageData(FW * SC, FH * SC) };
  for (const el of PRINT) {
    const [bx0, by0, bx1, by1] = el.box;
    const O = outs[el.name === 'logo' ? 'glass' : 'plate'].data;
    for (let ty = by0 * SC; ty < by1 * SC; ty++) for (let tx = bx0 * SC; tx < bx1 * SC; tx++) {
      const x = (tx + 0.5) / SC, y = (ty + 0.5) / SC;
      const [u, v] = el.map(x, y);
      const [r, g, b, a] = sample(u, v);
      let px = null;
      if (el.name === 'logo') {
        // stay on the clear panel: left of both diagonals, in the model and in the reference
        if (x > 362 + 0.845 * (y - 80) - 8 || x > 398 - 0.909 * (y - 820) - 8) continue;
        if (u > 552 + 0.7667 * (v - 290) - 30 || u > 531 - 0.94 * (v - 650) - 10) continue;
        px = [r, g, b, a];
      } else if (el.name === 'mark') {
        px = [18, 18, 20, clamp((150 - r) / 110) * a];
      } else {
        px = [255, 255, 255, clamp((r - 60) / 150) * a];
      }
      if (px[3] <= 0) continue;
      const o = ((ty - FACE.y0 * SC) * FW * SC + (tx - FACE.x0 * SC)) * 4;
      O[o] = px[0]; O[o + 1] = px[1]; O[o + 2] = px[2]; O[o + 3] = Math.round(px[3] * 255);
    }
  }
  const layer = (data, z, seeThrough) => {
    const c = document.createElement('canvas');
    c.width = FW * SC; c.height = FH * SC;
    c.getContext('2d').putImageData(data, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const geo = new THREE.PlaneGeometry(FW / 1000, FH / 1000);
    // Front: alpha-blended, so the glass behind it does not refract a ghost copy of the print.
    const front = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.FrontSide, toneMapped: false }));
    front.position.set(0, FH / 2000, z);
    plaque.add(front);
    if (seeThrough) {
      // Back: opaque cutout, which the transmission pass picks up, so the print reads mirrored through the glass.
      const back = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.45, alphaToCoverage: true, side: THREE.BackSide, toneMapped: false }));
      back.position.copy(front.position);
      plaque.add(back);
    }
  };
  layer(outs.glass, GLASS_T / 2 + 0.0006, true);
  layer(outs.plate, GLASS_T / 2 + PLATE_T + 0.0006, false);
};
img.src = PHOTO;

// ---------- view + motion ----------
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let spin = !reduceMotion;
let idleUntil = 0;
let goal = null; // target plaque yaw when a view button is pressed
const SPEED = 0.35; // rad/s

const spinBtn = document.getElementById('v-spin');
const setSpin = (v) => { spin = v; spinBtn.setAttribute('aria-pressed', String(v)); };
setSpin(spin);
spinBtn.addEventListener('click', () => { setSpin(!spin); goal = null; });

function resetCamera() {
  const dir = camera.position.clone().sub(controls.target);
  const d = dir.length();
  controls.target.copy(TARGET);
  camera.position.set(0, TARGET.y + 0.12, d);
}
function goTo(yaw) {
  setSpin(false);
  const cur = plaque.rotation.y;
  const twoPi = Math.PI * 2;
  let delta = ((yaw - cur) % twoPi + twoPi) % twoPi;
  if (delta > Math.PI) delta -= twoPi;
  goal = cur + delta;
  resetCamera();
}
document.getElementById('v-front').addEventListener('click', () => goTo(0));
document.getElementById('v-side').addEventListener('click', () => goTo(-Math.PI / 2));
document.getElementById('v-back').addEventListener('click', () => goTo(Math.PI));
controls.addEventListener('start', () => { idleUntil = Infinity; goal = null; });
controls.addEventListener('end', () => { idleUntil = performance.now() + 2500; });

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Fit the plaque into the free band between the caption (when it sits above) and the dock.
  const cap = document.querySelector('.caption').getBoundingClientRect();
  const dock = document.querySelector('.dock').getBoundingClientRect();
  const hint = document.querySelector('.hint').getBoundingClientRect();
  const top = w < 1200 ? cap.bottom + 16 : 24;
  const bottom = (w <= 640 ? hint.top : dock.top) - 16;
  const band = Math.max(bottom - top, h * 0.35);
  camera.setViewOffset(w, h, 0, h / 2 - (top + bottom) / 2, w, h);
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const needH = 1.14 * 1.12 * (h / band), needW = 0.95 * 1.25;
  const dH = needH / 2 / Math.tan(vfov / 2);
  const dW = needW / 2 / (Math.tan(vfov / 2) * camera.aspect);
  const d = Math.max(dH, dW);
  camera.position.set(0, TARGET.y + 0.12, d);
  controls.maxDistance = Math.max(5, d * 1.6);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
new ResizeObserver(fit).observe(stage);
document.fonts?.ready.then(fit); // caption height changes once the webfont lands
fit();

const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener?.('change', readStage);
new MutationObserver(readStage).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const angleEl = document.getElementById('angle');
let last = performance.now(), shownDeg = -1;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (goal !== null) {
    const diff = goal - plaque.rotation.y;
    plaque.rotation.y += diff * Math.min(1, dt * 6);
    if (Math.abs(diff) < 0.0005) { plaque.rotation.y = goal; goal = null; }
  } else if (spin && now > idleUntil) {
    plaque.rotation.y += SPEED * dt;
  }
  controls.update();
  const deg = Math.round(((THREE.MathUtils.radToDeg(plaque.rotation.y) % 360) + 360) % 360);
  if (deg !== shownDeg) { angleEl.textContent = deg + '°'; shownDeg = deg; }
  renderer.render(scene, camera);
});
</script>

</body>
